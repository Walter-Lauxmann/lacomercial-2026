<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Comercial</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/estilos.css" />
  </head>
  <body>
    <header>
      <h1>La Comercial</h1>
    </header>
    <nav class="menu">
      <div class="contenedor">
        <ul class="menu-flex">
          <li><a href="./">Inicio</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="contactenos.html">Contáctenos</a></li>
        </ul>
      </div>
    </nav>
    <main class="contenedor sombra">
      <div class="titulo-admin-flex">
        <h2>Listado de productos</h2>
        <button id="btn-nuevo-producto" class="boton-admin">➕ Cargar Nuevo Producto</button>
      </div>
      <hr />
      <section class="servicios" id="lista-productos">
               
      </section>
      <section class="carrito">
        <h3>Carrito de Compras</h3>
        <table>
          <thead>
            <th>Código</th>
            <th>Nombre</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Importe</th>
          </thead>
          <tbody id="lista-tabla">
                   
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3"></td>
              <td>Total</td>
              <td>$ <span id="total"></span>.-</td>
            </tr>
          </tfoot>          
        </table>
      </section>
    </main>

    <!-- Diálogo modal para cargar/modificar producto -->
    <dialog id="dialogo-producto">
      <form id="form-producto" class="formulario-modal">
        <h3 id="dialogo-titulo">Cargar Producto</h3>
        <input type="hidden" id="modo-edicion" value="false" />
        
        <div class="campo-modal">
          <label for="prod-codigo">Código:</label>
          <input type="number" id="prod-codigo" required min="1">
        </div>
        
        <div class="campo-modal">
          <label for="prod-nombre">Nombre:</label>
          <input type="text" id="prod-nombre" required>
        </div>

        <div class="campo-modal">
          <label for="prod-categoria">Categoría:</label>
          <input type="text" id="prod-categoria" required value="Telefonía">
        </div>

        <div class="campo-modal">
          <label for="prod-precio">Precio ($):</label>
          <input type="number" id="prod-precio" required min="0">
        </div>

        <div class="campo-modal">
          <label for="prod-imagen">Imagen (ej: default.jpg):</label>
          <input type="text" id="prod-imagen" placeholder="iPhone-SE-Black.jpg" required>
        </div>

        <fieldset class="especificaciones-grupo">
          <legend>Especificaciones</legend>
          
          <div class="campo-modal">
            <label for="prod-procesador">Procesador:</label>
            <input type="text" id="prod-procesador" required>
          </div>

          <div class="campo-modal">
            <label for="prod-almacenamiento">Almacenamiento:</label>
            <input type="text" id="prod-almacenamiento" required>
          </div>

          <div class="campo-modal">
            <label for="prod-camaras">Cámaras:</label>
            <input type="text" id="prod-camaras" required>
          </div>

          <div class="campo-modal">
            <label for="prod-pantalla">Pantalla:</label>
            <input type="text" id="prod-pantalla" required>
          </div>
        </fieldset>

        <div class="form-botones">
          <button type="submit" class="boton-dialogo guardar">Guardar</button>
          <button type="button" id="btn-cancelar" class="boton-dialogo cancelar">Cancelar</button>
        </div>
      </form>
    </dialog>

    <footer>
      <p>La Comercial - Todos los derechos reservados - 2026</p>
    </footer>

    <!-- Scripts -->
     <script type="module" src="./controllers/lista-productos.js"></script>
    <script src="./controllers/carrito-compras.js"></script>
  </body>
</html>
